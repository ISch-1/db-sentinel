spring:
  application:
    name: control-plane

server:
  port: 8080

dbsentinel:
  slo-table: ${SLO_TABLE:dbs-slo-definitions}
  prometheus-url: ${PROMETHEUS_URL:http://prometheus:9090}

management:
  server:
    port: 9100
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: control-plane

logging:
  level:
    com.dbsentinel: INFO
    software.amazon.awssdk: WARN
