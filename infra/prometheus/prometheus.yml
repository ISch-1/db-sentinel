global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentinel
    metrics_path: /metrics
    static_configs:
      - targets: ["sentinel:9200"]
        labels:
          service: sentinel

  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:9100"]
        labels:
          service: control-plane

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
